project:
  type: website
  resources:
    - CNAME

# Site-wide settings
website:
  title: "Notes of a nerd"
  description: "Ramblings of a lover of language, algorithms, and nature."
  site-url: https://blog.geile-hirnbude.de/
  repo-url: https://github.com/GeileHirnbude/notes-of-a-nerd
  navbar:
    title: "Notes of a nerd"
    right:
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/GeileHirnbude
  page-footer:
    center: "Powered by Quarto"

# Default HTML format
format:
  html:
    theme: cosmo
    toc: true
    code-fold: show

# Bibliography (citations) is built-in; no extra plugin needed
bibliography: references.bib
